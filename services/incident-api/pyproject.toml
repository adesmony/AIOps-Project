[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "incident-api"
version = "0.1.0"
description = "Read-only AI-assisted incident analysis API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "azure-identity>=1.19,<2",
    "azure-monitor-opentelemetry>=1.6,<2",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "openai>=1.58,<2",
    "pgvector>=0.3,<1",
    "pwdlib[argon2]>=0.2,<1",
    "pydantic-settings>=2.7,<3",
    "pyjwt[crypto]>=2.10,<3",
    "sqlglot>=26.0,<27",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=24.4,<26",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "debugpy>=1.8,<2",
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "ASYNC", "B", "UP"]
